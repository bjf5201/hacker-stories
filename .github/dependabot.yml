version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "tuesday"
          time: "01:30"
          timezone: "America/New_York"
      reviewers:
          - "bjf5201"
      labels:
          - "dependencies"
      commit-message:
          prefix: "chore"
          include: "scope"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "tuesday"
          time: "01:30"
          timezone: "America/New_York"
      reviewers:
          - "bjf5201"
      labels:
          - "ci"
          - "dependencies"
      commit-message:
          prefix: "ci"
          include: "scope"

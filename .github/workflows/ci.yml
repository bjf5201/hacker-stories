name: Biome Lint

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    biome:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Biome
              uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
              with:
                  version: 2.1.4
            - name: Run Biome
              run: biome ci .

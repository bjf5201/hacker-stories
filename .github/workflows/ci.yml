name: Biome Lint

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    biome:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Biome
              uses: biomejs/setup-biome@454fa0d884737805f48d7dc236c1761a0ac3cc13 # v2.6.0
              with:
                  version: 2.1.4
            - name: Run Biome
              run: biome ci .
